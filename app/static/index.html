<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Forecasting Dashboard</title>

<link rel="icon" type="image/png" href="D:\Python\Sales-Demand-forecast\app\static\public\android-chrome-512x512.png"/>

  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Sales Forecasting</h1>
    <nav class="tabs">
      <button class="tab active" data-tab="forecast">Forecast</button>
      <button class="tab" data-tab="results">Model results</button>
    </nav>
  </header>

  <main>
    <section id="tab-forecast" class="tab-panel active">
      <aside class="card controls">
        <label>Search store
          <input id="search" type="search" placeholder="e.g. 262" inputmode="numeric">
        </label>
        <label>Store type
          <select id="typeFilter"><option value="">All types</option></select>
        </label>
        <label>Sort by
          <select id="sortBy">
            <option value="id">Store number</option>
            <option value="worst">Largest error first</option>
            <option value="sales">Highest sales first</option>
          </select>
        </label>
        <label>History shown
          <select id="historyDays">
            <option value="30">30 days</option>
            <option value="90" selected>90 days</option>
            <option value="180">180 days</option>
            <option value="365">1 year</option>
          </select>
        </label>
        <label>Store
          <select id="storeSelect" size="12"></select>
        </label>
      </aside>

      <div class="content">
        <div id="status" class="status" role="status"></div>
        <div id="kpis" class="kpis"></div>
        <div class="card">
          <div class="chart-wrap"><canvas id="chart" aria-label="Forecast chart"></canvas></div>
        </div>
        <div class="card">
          <div class="table-head">
            <h2>Forecast by day</h2>
            <a id="csvLink" class="btn" href="#">Download CSV</a>
          </div>
          <div class="table-scroll"><table id="fcTable"></table></div>
        </div>
      </div>
    </section>

    <section id="tab-results" class="tab-panel"><div id="tables"></div></section>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
